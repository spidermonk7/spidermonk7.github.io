<div class="pf-talk-list">
{{ range where site.RegularPages "Section" "event" }}
  <article class="pf-talk-card">
    <time class="pf-talk-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <div><div class="pf-meta"><span>{{ .Params.event }}{{ with .Params.track }} · {{ . }}{{ end }}</span></div>
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <a class="pf-text-link" href="{{ .RelPermalink }}">View talk ↗</a>
    </div>
  </article>
{{ end }}
</div>
